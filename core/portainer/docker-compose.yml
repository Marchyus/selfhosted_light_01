services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`${MAIN_URL}`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000" # bind to HTTP
      # if bind to traefik https
      # 1. Define transport
      #- "traefik.http.serverstransports.portainer-transport.insecureskipverify=true"
      # 2. Assign the transport
      #- "traefik.http.services.portainer.loadbalancer.serverstransport=portainer-transport@docker"
volumes:
  portainer_data:
    name: portainer_data

networks:
  proxy:
    external: True
