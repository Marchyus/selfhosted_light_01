services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: ${UID}:${GID}
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /srv/media:/media
    ports:
      # Optionally - open for local network. Smart TVs might struggle with reverse proxy
      - "8096:8096/tcp"
      # Optionally - local network autodiscovery
      - "7359:7359/udp"
    restart: 'unless-stopped'
    # Optional - alternative address used for autodiscovery
    networks:
      - proxy
    environment:
      - JELLYFIN_PublishedServerUrl=${MAIN_URL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`${MAIN_URL}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
networks:
  proxy:
    external: true
